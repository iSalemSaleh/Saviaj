name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Decode upload keystore
        env:
          SAVIAJ_KEYSTORE_BASE64: ${{ secrets.SAVIAJ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SAVIAJ_KEYSTORE_BASE64" ]; then
            echo "SAVIAJ_KEYSTORE_BASE64 secret not set — building unsigned debug AAB"
          else
            echo "$SAVIAJ_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/saviaj-upload.keystore
            echo "SAVIAJ_KEYSTORE_PATH=$RUNNER_TEMP/saviaj-upload.keystore" >> $GITHUB_ENV
          fi

      - name: Build release AAB
        env:
          SAVIAJ_KEYSTORE_PASSWORD: ${{ secrets.SAVIAJ_KEYSTORE_PASSWORD }}
          SAVIAJ_KEY_ALIAS: ${{ secrets.SAVIAJ_KEY_ALIAS }}
          SAVIAJ_KEY_PASSWORD: ${{ secrets.SAVIAJ_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: saviaj-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Build APK (sideloadable, for testers without Play Store)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saviaj-app-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: warn
