name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Decode upload keystore
        env:
          SAVIAJ_KEYSTORE_BASE64: ${{ secrets.SAVIAJ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SAVIAJ_KEYSTORE_BASE64" ]; then
            echo "SAVIAJ_KEYSTORE_BASE64 secret not set — building unsigned debug AAB"
          else
            echo "$SAVIAJ_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/saviaj-upload.keystore
            echo "SAVIAJ_KEYSTORE_PATH=$RUNNER_TEMP/saviaj-upload.keystore" >> $GITHUB_ENV
          fi

      - name: Verify keystore credentials
        if: ${{ env.SAVIAJ_KEYSTORE_PATH != '' }}
        env:
          SAVIAJ_KEYSTORE_PASSWORD: ${{ secrets.SAVIAJ_KEYSTORE_PASSWORD }}
          SAVIAJ_KEY_ALIAS: ${{ secrets.SAVIAJ_KEY_ALIAS }}
          SAVIAJ_KEY_PASSWORD: ${{ secrets.SAVIAJ_KEY_PASSWORD }}
        run: |
          echo "Keystore file size: $(stat -c%s $SAVIAJ_KEYSTORE_PATH) bytes"
          echo "--- Trying store password ---"
          if keytool -list -keystore "$SAVIAJ_KEYSTORE_PATH" -storepass "$SAVIAJ_KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1; then
            echo "OK: store password works. Aliases:"
            grep -i "alias name" /tmp/ks.txt || cat /tmp/ks.txt
          else
            echo "FAIL: SAVIAJ_KEYSTORE_PASSWORD is wrong (or keystore is corrupt)."
            cat /tmp/ks.txt
            exit 1
          fi
          echo "--- Trying alias + key password ---"
          if keytool -list -v -keystore "$SAVIAJ_KEYSTORE_PATH" -storepass "$SAVIAJ_KEYSTORE_PASSWORD" -alias "$SAVIAJ_KEY_ALIAS" > /dev/null 2>&1; then
            echo "OK: alias '$SAVIAJ_KEY_ALIAS' exists."
          else
            echo "FAIL: SAVIAJ_KEY_ALIAS '$SAVIAJ_KEY_ALIAS' not found in keystore."
            keytool -list -keystore "$SAVIAJ_KEYSTORE_PATH" -storepass "$SAVIAJ_KEYSTORE_PASSWORD" 2>&1 | grep -i alias
            exit 1
          fi
          echo "--- Trying to access PRIVATE KEY with key password ---"
          # Use -certreq which actually unlocks the private key (proves keypass is correct).
          if keytool -certreq -keystore "$SAVIAJ_KEYSTORE_PATH" -storepass "$SAVIAJ_KEYSTORE_PASSWORD" -alias "$SAVIAJ_KEY_ALIAS" -keypass "$SAVIAJ_KEY_PASSWORD" > /dev/null 2>&1; then
            echo "OK: SAVIAJ_KEY_PASSWORD is correct — APK signing should succeed."
          else
            echo "FAIL: SAVIAJ_KEY_PASSWORD is WRONG for alias '$SAVIAJ_KEY_ALIAS'."
            echo "      (This is why APK signing fails with 'Keystore was tampered'.)"
            echo "      Fix: in GitHub repo Settings → Secrets, set SAVIAJ_KEY_PASSWORD to the password"
            echo "      you used when generating the keystore (often the SAME value as the store password)."
            exit 1
          fi

      - name: Pin Gradle to JDK 21
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          echo "Pinned Gradle to: $JAVA_HOME"
          $JAVA_HOME/bin/javac -version

      - name: Build release AAB
        env:
          SAVIAJ_KEYSTORE_PASSWORD: ${{ secrets.SAVIAJ_KEYSTORE_PASSWORD }}
          SAVIAJ_KEY_ALIAS: ${{ secrets.SAVIAJ_KEY_ALIAS }}
          SAVIAJ_KEY_PASSWORD: ${{ secrets.SAVIAJ_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build APK (sideloadable, for testers without Play Store)
        env:
          SAVIAJ_KEYSTORE_PASSWORD: ${{ secrets.SAVIAJ_KEYSTORE_PASSWORD }}
          SAVIAJ_KEY_ALIAS: ${{ secrets.SAVIAJ_KEY_ALIAS }}
          SAVIAJ_KEY_PASSWORD: ${{ secrets.SAVIAJ_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage release files
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/bundle/release/app-release.aab release-out/saviaj-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/release/app-release*.apk release-out/ 2>/dev/null || true
          ls -lah release-out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Saviaj Android build ${{ github.run_number }}
          body: |
            Automated Android build #${{ github.run_number }} from commit ${{ github.sha }}.

            - `saviaj-${{ github.run_number }}.aab` — upload to Google Play Console
            - `app-release.apk` — sideload directly on a device for testing
          files: release-out/*
          draft: false
          prerelease: true
