# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Saviaj

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for azure/login OIDC if used
      contents: read    # required for actions/checkout

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js version
        uses: actions/setup-node@v5
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      # Package only the files Azure App Service actually needs.
      # Excluding node_modules, .git, attached_assets, and other dev-only
      # paths shrinks the artifact from ~500MB to ~20MB. Azure (Oryx) will
      # run `npm install --omit=dev` on the App Service after deploy because
      # SCM_DO_BUILD_DURING_DEPLOYMENT=true is set on the App Service.
      - name: Zip release for deployment
        run: |
          zip -r release.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "attached_assets/*" \
            -x ".local/*" \
            -x "screenshots/*" \
            -x "*.log"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploys directly from the build runner — no upload-artifact /
      # download-artifact step, so this workflow does NOT consume the
      # GitHub Actions artifact storage quota.
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Saviaj'
          slot-name: 'Production'
          package: release.zip
